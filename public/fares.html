<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090B0F">
<meta name="description" content="Observed Robotaxi fares by city, vehicle and date.">
<link rel="canonical" href="https://cybercabhunter.com/fares">
<link rel="icon" href="/favicon.ico">
<script src="js/theme.js?v=5"></script>
<link rel="stylesheet" href="/css/brand-type.css">
<link rel="stylesheet" href="/css/fare-history.css">
<script src="/js/fare-history.js" defer></script>
<title>CybercabHunter</title>
</head>
<body>
<header class="site-header"><nav aria-label="Primary">
  <a class="wordmark" href="/"><img src="/images/brand/favicon-32.png?v=b1" alt="">CybercabHunter</a>
  <a href="/simulation?view=eta">Fleet ETA</a>
</nav></header>
<main>
  <h1>Fare History</h1>
  <p class="intro">What Robotaxi rides cost, based on approved receipts and completed-ride reports.</p>
  <form id="filters" aria-label="Fare filters">
    <label>City<select name="city"><option value="all">All cities</option></select></label>
    <label>Vehicle<select name="vehicle"><option value="all">All vehicles</option><option value="cybercab">Cybercab</option><option value="model_y">Model Y</option></select></label>
    <label>Range<select name="range"><option value="30d">30 days</option><option value="90d" selected>90 days</option><option value="1y">1 year</option><option value="all">All time</option></select></label>
  </form>
  <p class="threshold">Each bucket needs 10 qualifying observations to show a median.</p>
  <p id="status" role="status"></p>
  <div id="charts"></div>
</main>
<footer><a href="/">CybercabHunter</a><a href="/privacy">Privacy</a></footer>
<script src="/vendor/gsap-3.13.0.min.js" defer></script>
<script src="/vendor/ScrollTrigger-3.13.0.min.js" defer></script>
<script src="js/animated-content.js?v=1" defer></script>
</body>
</html>
