<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/Cybercab2.png">
<link rel="apple-touch-icon" href="images/Cybercab2.png">
<title>Cybercab Hunter — Sign In</title>
<script>
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  window.scrollTo(0, 0);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { void:'#07090E', panel:'#0F141C', gold:'#D4AF37', goldsoft:'#F3E5AB',
        crimson:'#E82127', silver:'#CBD5E1', cyan:'#00E5FF', cyblue:'#0284C7' },
      fontFamily: { display:['Space Grotesk','sans-serif'], body:['Inter','sans-serif'] }
    }}
  }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-void text-slate-100 font-body">
<div class="bg-mesh"></div>

<div class="min-h-screen grid lg:grid-cols-2">
  <!-- Left: hero image panel (desktop only) -->
  <aside class="relative hidden lg:block overflow-hidden border-r border-[rgba(212,175,55,0.15)]">
    <div class="absolute inset-0" style="background:url('images/HeroImage.png') center/cover no-repeat;"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-void via-void/40 to-void/10"></div>
    <div class="absolute inset-0" style="background:radial-gradient(ellipse 70% 60% at 30% 80%, rgba(212,175,55,0.14), transparent 60%);"></div>
    <a href="index.html" class="absolute top-8 left-10 flex items-center gap-2">
      <img src="images/Cybercab2.png" alt="Cybercab Hunter" class="w-11 h-11 object-contain">
      <div class="leading-tight">
        <div class="font-display font-bold text-base tracking-wide">CYBERCAB</div>
        <div class="text-[9.5px] text-slate-400 tracking-[0.2em] font-semibold">HUNTER</div>
      </div>
    </a>
  </aside>

  <!-- Right: sign-in -->
  <main class="flex flex-col px-6 sm:px-12 py-10">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 lg:invisible">
        <img src="images/Cybercab2.png" alt="Cybercab Hunter" class="w-10 h-10 object-contain">
        <div class="leading-tight">
          <div class="font-display font-bold text-sm tracking-wide">CYBERCAB</div>
          <div class="text-[9px] text-slate-400 tracking-[0.2em] font-semibold">HUNTER</div>
        </div>
      </a>
      <a href="index.html" class="text-sm text-slate-400 hover:text-gold transition-colors">&larr; Back to home</a>
    </div>

    <div class="flex-1 flex items-center">
      <div class="w-full max-w-sm mx-auto reveal-on-scroll">
        <h1 class="font-display font-bold text-4xl tracking-tight mb-8">Sign in</h1>

        <!-- Google: real server-side OAuth (see worker/google-auth.js) — a
             plain link, so the browser does a full-page navigation straight
             to the Worker's /oauth/google/start, exactly like the existing
             Tesla "Link Account" button. -->
        <a id="signInGoogle" href="https://cybercabhunter.contactjoeclos.workers.dev/oauth/google/start" class="btn-magnetic w-full inline-flex items-center justify-center gap-3 px-4 py-3.5 rounded-lg text-sm font-semibold border border-[rgba(212,175,55,0.35)] bg-panel text-slate-100 hover:border-gold transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.92l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.27v3.1C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.27A11.97 11.97 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.62l4 3.1C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
          Continue with Google
        </a>
      </div>
    </div>
  </main>
</div>

<script src="js/calc.js?v=2"></script>
<script src="js/main.js?v=3"></script>
<script>
  CCC.init();

  // "/signin?returnTo=/moderation": hand the requested page to the Worker's
  // sign-in start so the visitor comes back there instead of the home page.
  // Only a same-site path is passed on; the Worker validates it again and is
  // the authority, this just avoids sending obvious junk.
  (function () {
    var link = document.getElementById('signInGoogle');
    var raw = new URLSearchParams(location.search).get('returnTo');
    if (!link || !raw) return;
    if (raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.charAt(1) === '\\') return;
    link.href = link.href.split('?')[0] + '?returnTo=' + encodeURIComponent(raw);
  })();
</script>
</body>
</html>
